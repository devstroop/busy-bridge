name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Full history + tags: build.zig derives the release version from
      # `git describe` — a shallow checkout has no tags and the version
      # degrades to a bare commit SHA (which rightly fails the smoke test).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official tarball + sha256 verified against ziglang.org's index.json.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/index.json -o index.json
          tarball=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball' index.json)
          shasum=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum' index.json)
          echo "fetching $tarball"
          curl -fsSL "$tarball" -o zig.tar.xz
          echo "$shasum  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/zig"
          tar -xJf zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $idx = Invoke-RestMethod https://ziglang.org/download/index.json
          $e = $idx.$env:ZIG_VERSION.'x86_64-windows'
          Write-Host "fetching $($e.tarball)"
          Invoke-WebRequest -Uri $e.tarball -OutFile zig.zip
          $hash = (Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $e.shasum.ToLower()) { throw "checksum mismatch: got $hash want $($e.shasum)" }
          $dest = Join-Path $env:RUNNER_TEMP 'zig'
          Expand-Archive zig.zip -DestinationPath $dest
          $extracted = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_PATH $extracted

      - name: Verify Zig
        shell: bash
        run: zig version

      # Sources must be LF + fmt-clean (see .gitattributes); ubuntu checkout is LF.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig src

      # Layer rules: util has no BUSY knowledge; core never imports transport.
      - name: Check layer boundaries
        shell: pwsh
        run: ./scripts/check_layers.ps1

      # File-size gate (issue 011): src <=400 physical lines, tests <=200;
      # allowlist entries must carry a written reason.
      - name: Check file sizes
        shell: pwsh
        run: ./scripts/check_size.ps1

      # Cross-compiles x86-windows-gnu on Linux; native on Windows.
      - name: Build
        run: zig build

      # Pure-codec unit tests (x86-windows test binary — runnable on Windows).
      - name: Unit tests
        if: runner.os == 'Windows'
        run: zig build test

      # Test-discovery gate: assert the EXACT discovered count (issue 011
      # lesson — 26 tests silently stopped running when aggregation broke).
      - name: Check test discovery count
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_tests.ps1

      # Run the real binary: version + registry enumeration (no BUSY needed).
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = & 'zig-out\bin\busy-bridge.exe' version
          Write-Output $v
          if ($LASTEXITCODE -ne 0 -or $v -notmatch '0\.1\.0') { throw "version smoke failed: $v" }
          $c = & 'zig-out\bin\busy-bridge.exe' classes
          if ($LASTEXITCODE -ne 0) { throw 'classes smoke failed' }
          Write-Output ($c.Substring(0, [Math]::Min(160, $c.Length)))

  # Replay suite (issue 009): host-native, no COM, no BUSY — the same
  # transcript-driven tests run on both OSes. The exact-count gate runs
  # on Windows (the test.exe name is shared with the main suite, so the
  # two count scripts must never run concurrently).
  replay-test:
    name: replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Same full-history rationale as the build job: version injection
      # needs tags even though replay tests never print the version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/index.json -o index.json
          tarball=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball' index.json)
          shasum=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum' index.json)
          echo "fetching $tarball"
          curl -fsSL "$tarball" -o zig.tar.xz
          echo "$shasum  zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/zig"
          tar -xJf zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $idx = Invoke-RestMethod https://ziglang.org/download/index.json
          $e = $idx.$env:ZIG_VERSION.'x86_64-windows'
          Write-Host "fetching $($e.tarball)"
          Invoke-WebRequest -Uri $e.tarball -OutFile zig.zip
          $hash = (Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $e.shasum.ToLower()) { throw "checksum mismatch: got $hash want $($e.shasum)" }
          $dest = Join-Path $env:RUNNER_TEMP 'zig'
          Expand-Archive zig.zip -DestinationPath $dest
          $extracted = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_PATH $extracted

      - name: Replay tests (host-native, no BUSY)
        run: zig build replay-test

      - name: Check replay count
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_replay.ps1

  # Fork-parity gate (issue #63): the mirrored handlers/transport slice
  # must stay import-rewrites-only vs busy-server; the auth slice is
  # zero-tolerance. Fast standalone job — no zig, no BUSY.
  fork-parity:
    name: fork-parity (busy-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: devstroop/busy-server
          path: busy-server

      - name: Check fork parity
        shell: pwsh
        run: ./scripts/check_fork_parity.ps1 -ServerRoot "$env:GITHUB_WORKSPACE/busy-server"
